# ============================================================
# Forecast Horizons Configuration
# ============================================================
horizons_minutes: [15, 30, 60, 120, 180, 360]

# Display labels for each horizon
horizon_labels:
  15: "+15 min"
  30: "+30 min"
  60: "+1 hour"
  120: "+2 hours"
  180: "+3 hours"
  360: "+6 hours"

# Target window (minutes): how long after T+horizon a positive
# event must occur to count as a positive label.
# E.g. for +15min horizon, a strike within ±7 min of T+15 counts.
target_window_tolerance_min: 15
